services:
  mysql:
    image: mysql:8.4
    container_name: url-shortener-mysql
    environment:
      MYSQL_DATABASE: url_shortener
      MYSQL_USER: url_shortener
      MYSQL_PASSWORD: localdevpass
      MYSQL_ROOT_PASSWORD: localdevroot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ../server
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/url_shortener
      DATABASE_USERNAME: url_shortener
      DATABASE_PASSWORD: localdevpass
      JWT_SECRET: Y2hhbmdlLXRoaXMtd2l0aC1hLXN0cm9uZy1yYW5kb20tc2VjcmV0
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
